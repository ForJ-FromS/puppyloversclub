<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frost Bird</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0C0D11;
    --card:#14161C;
    --line:#22252E;
    --text:#C9CDD7;
    --title:#EBEDF2;
    --soft:#818899;
    --faint:#565C6A;
    --silver:#DDE0E8;
    --lamp:#E2AF58;
    --pl-panel-bg:#171A21;
    --pl-panel-text:#D5D9E0;
    --pl-line:#2B2F3A;
    --pl-accent:#C9CDD8;
    --pl-accent-text:#14161C;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--bg);
    background-image:
      radial-gradient(ellipse 80% 40% at 50% -5%, rgba(140,150,175,.07), transparent 70%);
    color:var(--text);
    font-family:'IBM Plex Sans KR',sans-serif;font-weight:300;
    line-height:1.9;min-height:100vh;
    padding:44px 16px 64px;
  }
  a{text-decoration:none;color:inherit}
  .wrap{max-width:820px;margin:0 auto}

  .back{
    display:inline-flex;align-items:center;gap:8px;
    border:1px solid var(--line);background:var(--card);
    border-radius:999px;padding:9px 20px;margin-bottom:18px;
    font-family:'IBM Plex Mono',monospace;font-size:10px;
    letter-spacing:.2em;color:var(--soft);
  }
  .back:hover{color:var(--silver);border-color:var(--soft)}

  article{
    background:var(--card);border-radius:16px;
    border:1px solid var(--line);
    padding:clamp(26px,5vw,48px);
    position:relative;overflow:hidden;
  }
  article::before{content:'';position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,.01) 0 1px, transparent 1px 3px)}
  #pp-meta{font-family:'IBM Plex Mono',monospace;font-size:10px;
    letter-spacing:.18em;color:var(--faint)}
  #pp-title{margin-top:10px;font-size:clamp(20px,3.4vw,26px);
    font-weight:600;color:var(--title);line-height:1.5}
  .rule{border:none;border-top:1px solid var(--line);margin:22px 0 26px}
  #pp-body{font-size:14.5px;color:var(--text);line-height:2.1}
  #pp-body p{margin-bottom:1.1em}
  #pp-body img{max-width:100%;border-radius:8px}

  .actions{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);
    display:flex;gap:10px;position:relative}
  .actions button{
    border:1px solid var(--line);background:none;color:var(--soft);
    border-radius:8px;padding:8px 16px;font-size:12px;cursor:pointer;
    font-family:'IBM Plex Sans KR',sans-serif;
  }
  .actions button:hover{color:var(--silver);border-color:var(--soft)}

  footer{max-width:820px;margin:20px auto 0;text-align:center;
    font-family:'IBM Plex Mono',monospace;font-size:8.5px;
    letter-spacing:.28em;color:var(--faint)}
</style>
</head>
<body>
<div class="wrap">

  <a class="back" href="./">‹ RECEIVED LOG</a>

  <article>
    <p id="pp-meta">—</p>
    <h1 id="pp-title">수신 중...</h1>
    <hr class="rule">
    <div id="pp-body"></div>
    <div class="actions">
      <button onclick="PL.copyLink()">🔗 링크 복사</button>
      <button id="pp-del" onclick="PL.deletePost()">🗑 삭제</button>
    </div>
  </article>

</div>
<footer>ⓒ FORJ-FROMS · /NINE/</footer>

<script>
window.PL_PAGE = 'post';
window.PL_CONFIG = {
  owner:'forj-froms',
  repo:'puppyloversclub',
  branch:'main',
  base:'nine'
};
window.PL_TEMPLATES = {};
</script>
<script src="../assets/engine.js"></script>
</body>
</html>
