<script>
  // /blue/0002 , /nine/ms7c0bsn 같은 깔끔한 주소를 글 페이지로 연결

    var m = location.pathname.match(/^\/(blue|nine)\/([A-Za-z0-9_-]+)\/?$/);
    if(m) location.replace('/'+m[1]+'/post.html?p='+encodeURIComponent(m[2]));
  })();
</script>

  p{font-size:13px;letter-spacing:.2em;color:#6E7078}
  a{color:#EDEEF2;text-decoration:none;font-size:15px;letter-spacing:.3em;
