<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unpainted Shades of Blue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --box:#FFFFFF;
    --text:#3E5273;
    --title:#34496A;
    --body:#657D9E;
    --muted:#91A5BF;
    --line:rgba(72,128,181,.15);
    --accent:#327BC1;
    --accent-soft:#EDF3FA;
    --panel:rgba(255,255,255,.42);
    --panel-line:rgba(255,255,255,.8);
    --pl-panel-bg:#FFFFFF;
    --pl-panel-text:#34496A;
    --pl-line:rgba(72,128,181,.25);
    --pl-accent:#327BC1;
    --pl-accent-text:#FFFFFF;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    color:var(--text);
    font-family:'Noto Sans KR',sans-serif;font-weight:400;
    line-height:1.9;min-height:100vh;
    padding:44px 16px 64px;
    background:url("bg.jpg") center/cover no-repeat fixed;
  }
  a{text-decoration:none;color:inherit}
  .wrap{max-width:820px;margin:0 auto}

  .back{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--panel);border:1.5px solid var(--panel-line);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border-radius:999px;padding:9px 20px;margin-bottom:18px;
    font-size:13px;color:var(--title);
    box-shadow:0 10px 26px -18px rgba(24,52,96,.6);
  }
  .back:hover{color:var(--accent)}

  .panel{
    background:var(--panel);
    border:1.5px solid var(--panel-line);
    border-radius:24px;
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    padding:26px;
    box-shadow:0 26px 54px -34px rgba(24,52,96,.65);
  }
  @media(max-width:560px){.panel{padding:16px 12px;border-radius:20px}}

  article{
    background:var(--box);border-radius:16px;
    border:1px solid var(--line);
    padding:clamp(26px,5vw,48px);
  }
  #pp-meta{font-family:'IBM Plex Mono',monospace;font-size:10.5px;
    letter-spacing:.12em;color:var(--muted)}
  #pp-title{margin-top:8px;font-size:clamp(20px,3.4vw,26px);
    font-weight:500;color:var(--title);line-height:1.5}
  .rule{border:none;border-top:1px solid var(--line);margin:22px 0 26px}
  #pp-body{font-size:15px;font-weight:400;color:var(--text);line-height:2.1}
  #pp-body p{margin-bottom:1.1em}
  #pp-body img{max-width:100%;border-radius:10px}

  .actions{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);
    display:flex;gap:10px}
  .actions button{
    border:1px solid var(--line);background:none;color:var(--body);
    border-radius:9px;padding:8px 16px;font-size:12.5px;cursor:pointer;
    font-family:'Noto Sans KR',sans-serif;
  }
  .actions button:hover{color:var(--accent);border-color:var(--accent)}

  footer{max-width:820px;margin:18px auto 0;text-align:center;
    font-family:'IBM Plex Mono',monospace;font-size:9px;
    letter-spacing:.25em;color:var(--title);
    text-shadow:0 1px 6px rgba(255,255,255,.7)}
</style>
</head>
<body>
<div class="wrap">

  <a class="back" href="./">‹ 목록 가기</a>

  <div class="panel">
    <article>
      <p id="pp-meta">—</p>
      <h1 id="pp-title">불러오는 중...</h1>
      <hr class="rule">
      <div id="pp-body"></div>
      <div class="actions">
        <button onclick="PL.copyLink()">🔗 링크 복사</button>
        <button id="pp-edit" onclick="PL.editPost()">✏️ 수정</button>
        <button id="pp-del" onclick="PL.deletePost()">🗑 삭제</button>
      </div>
    </article>
  </div>

</div>
<footer>ⓒ FORJ-FROMS · /BLUE/</footer>

<script>
window.PL_PAGE = 'post';
window.PL_CONFIG = {
  owner:'forj-froms',
  repo:'puppyloversclub',
  branch:'main',
  base:'blue'
};
window.PL_TEMPLATES = {};
</script>
<script src="../assets/engine.js"></script>
</body>
</html>
